# Apache2 vhost for Code Campus — reverse-proxies to the Next.js process
# (bound to 127.0.0.1 only; Apache is the only public-facing endpoint).
#
# Install: sudo cp deploy/apache/code-campus.conf /etc/apache2/sites-available/
#          sudo a2ensite code-campus.conf
#          sudo systemctl reload apache2
#
# Then run certbot (see deploy/DEPLOYMENT.md Step 9) — it edits this file in
# place to add the :443 SSL vhost and the http->https redirect. Don't hand-add
# a <VirtualHost *:443> block yourself first; let certbot generate it.

<VirtualHost *:80>
    ServerName code-campus.countonrobert.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        / http://127.0.0.1:3007/
    ProxyPassReverse / http://127.0.0.1:3007/

    ErrorLog  ${APACHE_LOG_DIR}/code-campus-error.log
    CustomLog ${APACHE_LOG_DIR}/code-campus-access.log combined
</VirtualHost>
